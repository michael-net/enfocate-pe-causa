# Compila las apps de celular en máquinas reales: Android en Linux, iPhone en macOS.
name: Celular

on:
  push:
    paths: ['android/**', 'ios/**', '.github/workflows/movil.yml']
  pull_request:
    paths: ['android/**', 'ios/**', '.github/workflows/movil.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Probar las reglas y compilar
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Comprobar que no tiene permiso de internet
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permisos.txt
          if grep -q 'android.permission.INTERNET' permisos.txt; then
            echo "La app no debe tener permiso de internet"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: enfocate-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generar el proyecto
        run: brew install xcodegen && xcodegen
      - name: Compilar para el simulador
        run: |
          xcodebuild build -project Enfocate.xcodeproj -scheme Enfocate \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -50
          exit ${PIPESTATUS[0]}
