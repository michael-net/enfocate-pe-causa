# Prueba el bloqueo en navegadores reales de macOS y Windows, con una sesión de enfoque activa.
name: Navegadores

on:
  push:
    paths: ['macos/**', 'windows/**', 'pruebas/**', '.github/workflows/navegadores.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deja a la prueba leer el estado interno de Firefox (DNS y políticas).
  MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install selenium
      - name: Instalar
        shell: powershell
        run: |
          $prueba = Join-Path $env:RUNNER_TEMP 'dueno'
          Set-Content $prueba 'x'
          $sid = (Get-Acl $prueba).GetOwner([Security.Principal.SecurityIdentifier]).Value
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File windows\instalar.ps1 -Sid $sid -Elevado
          if ($LASTEXITCODE) { throw "El instalador falló ($LASTEXITCODE)" }
          # Orden que empieza la sesión, la que usará la prueba.
          @'
          $datos = Join-Path $env:ProgramData 'Enfocate'
          function Orden($c) {
            $n = 'cmd-{0:D13}-{1:x8}' -f [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds(), (Get-Random)
            Set-Content (Join-Path $datos "ordenes\$n") $c -Encoding ASCII
            Start-Sleep -Seconds 2
          }
          Orden 'site+ wikipedia.org'
          Orden 'site+ github.com'
          Orden 'focus60'
          $hosts = "$env:WINDIR\System32\drivers\etc\hosts"
          for ($i = 0; $i -lt 30 -and -not (Select-String -Quiet '127.0.0.1 github.com' $hosts); $i++) { Start-Sleep 1 }
          Get-Content $hosts | Select-Object -Last 12
          Resolve-DnsName www.youtube.com -Type A -ErrorAction SilentlyContinue | Select-Object -First 1 | Format-Table Name, IPAddress
          # Diagnóstico temporal: conexiones de Firefox después del corte.
          Start-Sleep 2
          $ff = @(Get-Process firefox -ErrorAction SilentlyContinue | ForEach-Object Id)
          Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue | Where-Object { $ff -contains $_.OwningProcess -and $_.RemotePort -in 80, 443 } |
            Format-Table LocalAddress, RemoteAddress, RemotePort, OwningProcess -AutoSize | Out-String -Width 200 | Write-Host
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'iniciar.ps1')
      - name: Probar Chrome, Edge y Firefox
        shell: powershell
        run: python pruebas\navegadores.py "powershell -NoProfile -ExecutionPolicy Bypass -File $env:RUNNER_TEMP\iniciar.ps1" chrome edge firefox

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install selenium
      - name: Instalar
        run: |
          sudo bash macos/install-service.sh
          sudo safaridriver --enable
          cat > "$RUNNER_TEMP/iniciar.sh" <<'SH'
          orden() {
            n=$(printf 'cmd-%013d-%08x' "$(( $(date +%s) * 1000 ))" "$RANDOM$RANDOM")
            echo "$1" > "/Users/Shared/focus-sesion/$n"
            sleep 2
          }
          orden "site+ wikipedia.org"
          orden "site+ github.com"
          orden focus60
          for i in $(seq 30); do grep -q '127.0.0.1 github.com' /etc/hosts && break; sleep 1; done
          tail -12 /etc/hosts
          # Diagnóstico temporal: procesos y conexiones de Safari y Firefox después del corte.
          sleep 2
          ps -axo pid,user,comm | grep -i -E 'webkit|safari|firefox' | grep -v grep
          sleep 3
          echo "rutas cortadas:"; cat "/Library/Application Support/focus/rutas" 2>/dev/null
          curl -sS -m 5 -o /dev/null -w 'curl youtube: %{remote_ip} %{http_code}\n' https://www.youtube.com || true
          SH
      - name: Probar Safari, Chrome, Edge y Firefox
        run: python pruebas/navegadores.py "bash $RUNNER_TEMP/iniciar.sh" safari chrome edge firefox
