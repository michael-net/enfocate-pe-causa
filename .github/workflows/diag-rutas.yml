# Diagnóstico temporal: cortar una conexión abierta con una ruta de rechazo en macOS.
name: Diagnóstico rutas
on:
  push:
    paths: ['.github/workflows/diag-rutas.yml']
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - run: |
          IP=$(dig +short www.wikipedia.org A | grep -E '^[0-9.]+$' | head -1); echo "ip $IP"
          cat > /tmp/con.py <<'PY'
          import http.client, sys, time, socket
          c = http.client.HTTPSConnection(sys.argv[1], 443, timeout=10)
          c._create_connection = lambda *a, **k: socket.create_connection((sys.argv[2], 443), timeout=10)
          def pedir(n):
              try:
                  c.request("GET", "/?n=%d" % n, headers={"Host": "www.wikipedia.org"}); r = c.getresponse(); r.read(); print(n, "ok", r.status, flush=True)
              except Exception as e:
                  print(n, "error", repr(e), flush=True)
          pedir(1)
          open("/tmp/listo", "w").close()
          while not __import__("os").path.exists("/tmp/sigue"): time.sleep(0.2)
          pedir(2); pedir(3)
          PY
          python3 /tmp/con.py www.wikipedia.org "$IP" &
          until [ -f /tmp/listo ]; do sleep 0.2; done
          sudo pfctl -s info | head -2
          sudo pfctl -f /etc/pf.conf 2>&1 | grep -v ALTQ | tail -3
          echo "block return out quick proto { tcp udp } from any to $IP" | sudo pfctl -a com.apple/250.Enfocate -f - 2>&1 | grep -v ALTQ
          TOK=$(sudo pfctl -E 2>&1 | sed -n 's/.*Token : \([0-9]*\).*/\1/p'); echo "token $TOK"
          sudo pfctl -a com.apple/250.Enfocate -s rules
          touch /tmp/sigue; wait
          curl -sS -m 5 -o /dev/null -w "curl nueva conexion %{http_code}\n" --resolve "www.wikipedia.org:443:$IP" https://www.wikipedia.org/ || true
          sudo pfctl -a com.apple/250.Enfocate -F all 2>&1 | grep -v ALTQ; sudo pfctl -X "$TOK" 2>&1 | tail -1
          curl -sS -m 5 -o /dev/null -w "curl tras quitar %{http_code}\n" --resolve "www.wikipedia.org:443:$IP" https://www.wikipedia.org/ || true
          sudo pfctl -s info | head -1
